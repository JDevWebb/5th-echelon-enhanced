# A trial of the launcher's Play screen in Tauri 2 (a web page in a native window, Rust behind
# it), to compare with the egui launcher: its look and animations, size, memory and start-up.
# Not part of the workspace, not shipped.
[package]
name = "tauri-play-trial"
version = "0.0.1"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
