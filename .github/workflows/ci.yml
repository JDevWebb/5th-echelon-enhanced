# Tests and builds every push to main and every pull request. A push that only changes
# release.toml (scripts/release.sh's "Release vX" and "Version X-dev" commits, after CI has
# passed on what they version: the release workflow builds the tag itself) or release notes
# doesn't run it again.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - release.toml
      - docs/releases/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Tests, test players and Linux builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Install the toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the coordinator's admin UI (Node comes with the runner)
        working-directory: coordinator/admin-ui
        run: npm ci --no-audit --no-fund && npm run build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --locked --workspace --exclude hooks --exclude umd_browser
      - name: Test players against a fresh server
        run: |
          cargo build --locked -p dedicated_server -p testbot
          scripts/bots.sh target/debug
          FRIENDS_MODE=mutual scripts/bots.sh target/debug friends-mutual
          REQUIRE_IDENTITY=1 scripts/bots.sh target/debug identity-required
      - name: Shell scripts (ShellCheck comes with the runner)
        run: |
          shellcheck -S warning scripts/install-server.sh scripts/harden-host.sh scripts/bots.sh \
            scripts/federation-test.sh scripts/proxy-test.sh scripts/ops-test.sh \
            scripts/release.sh scripts/sign-release.sh build/build.sh
      - name: Servers sharing friends, a server behind a proxy, and what the installer runs as root
        run: |
          cargo build --locked -p coordinator
          # A small image with what the tests use inside their containers; the programs
          # are this job's, mounted in.
          docker build -q -t fes-ci - <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends bash curl python3 openssl unzip ca-certificates procps \
            && rm -rf /var/lib/apt/lists/*
          EOF
          export IMAGE=fes-ci BIN_MOUNT="-v $PWD/target/debug:/ci-bin:ro"
          scripts/federation-test.sh /ci-bin
          scripts/proxy-test.sh /ci-bin
          scripts/ops-test.sh /ci-bin
      - name: The Linux launcher builds
        run: cargo build --locked -p launcher

  windows:
    name: Windows builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # protoc for the API's generated code: a pinned release, checked against its SHA-256
      # (arduino/setup-protoc has no release on Node.js 24).
      - name: Install protoc
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3') { throw 'protoc download failed its checksum' }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive $zip -DestinationPath $dir
          Add-Content $env:GITHUB_PATH (Join-Path $dir 'bin')
      - name: Install the toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Client DLL
        run: cargo build --locked -p hooks --target i686-pc-windows-msvc
      - name: Client DLL tests
        run: cargo test --locked -p hooks --target i686-pc-windows-msvc
      - name: Launcher with the client inside, server and test players
        shell: bash
        run: |
          HOOKS_DLL="$PWD/target/i686-pc-windows-msvc/debug/hooks.dll" cargo build --locked -p launcher --features embed-dll
          cargo build --locked -p dedicated_server -p testbot
