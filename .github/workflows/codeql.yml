# CodeQL code scanning, in place of GitHub's default setup (the same languages, query suite and
# categories, so earlier alerts and their dismissals carry over). One difference: results in
# Rust test code (`#[cfg(test)]` items, tests/ folders, tools/testbot) are dropped before the
# upload by scripts/codeql-drop-tests.py. Test fixtures aren't shipped, and default setup can't
# leave them out: they sit in the same files as the code.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - release.toml
      - docs/**
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results
      - name: Drop results in test code
        run: |
          for f in sarif-results/*.sarif; do python3 scripts/codeql-drop-tests.py "$f" .; done
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
