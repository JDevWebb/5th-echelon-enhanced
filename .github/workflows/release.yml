# Publishes a release when a version tag is pushed:
#
#   1. set `version` in release.toml (e.g. "0.3.1") and commit;
#   2. git tag v0.3.1 && git push origin main v0.3.1
#   3. scripts/sign-release.sh v0.3.1 (signs with the offline release key,
#      then publishes the draft).
#
# Builds every download the README and the launcher's updater expect,
# writes SHA256SUMS, makes a draft GitHub release, and pushes the server's
# Docker image to ghcr.io. A tag with a suffix (v0.3.1-rc.1) makes a
# pre-release, which the launcher's updater doesn't offer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches release.toml
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file=$(sed -n 's/^version = "\(.*\)"$/\1/p' release.toml)
          if [ "$tag" != "$file" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match release.toml version $file"
            exit 1
          fi
          # Only plain version numbers go any further (into file names,
          # image tags and commands).
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$tag isn't a version like 0.3.1 or 0.3.1-rc.1"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  windows:
    name: Windows builds
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        shell: bash
        run: |
          cargo build --locked --release -p hooks --target i686-pc-windows-msvc
          dll="$PWD/target/i686-pc-windows-msvc/release/hooks.dll"
          HOOKS_DLL="$dll" cargo build --locked --release -p launcher --features embed-dll
          cargo build --locked --release -p dedicated_server -p testbot
          mkdir dist
          cp "$dll" dist/uplay_r1_loader.dll
          cp target/release/launcher.exe target/release/dedicated_server.exe target/release/testbot.exe dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/

  linux:
    name: Linux builds
    needs: windows
    # An older glibc, so the binaries run on Debian 12, SteamOS and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows
          path: windows
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Install the toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: |
          HOOKS_DLL="$PWD/windows/uplay_r1_loader.dll" cargo build --locked --release -p launcher --features embed-dll
          cargo build --locked --release -p dedicated_server -p coordinator
          mkdir dist
          cp target/release/launcher dist/launcher-linux-x86_64
          cp target/release/dedicated_server dist/dedicated_server-linux-x86_64
          cp target/release/coordinator dist/coordinator-linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/

  publish:
    name: Publish the release
    needs: [version, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir dist
          cp artifacts/windows/* artifacts/linux/* dist/
          chmod +x dist/*-linux-x86_64
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      # Build provenance for every download: `gh attestation verify <file>
      # --repo JDevWebb/5th-echelon-enhanced` shows it came from this workflow.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      # How to check a download, with each file's VirusTotal results. The scan
      # needs the VT_API_KEY secret (a free VirusTotal account's key); without
      # it, the notes link each file's report by its hash instead.
      - name: Scan with VirusTotal
        id: vt
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "No VT_API_KEY secret; skipping the scan"; exit 1; fi
          scripts/virustotal.sh dist/launcher.exe dist/uplay_r1_loader.dll dist/dedicated_server.exe \
            dist/launcher-linux-x86_64 dist/dedicated_server-linux-x86_64 dist/coordinator-linux-x86_64 > vt.md
          cat vt.md
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Verify your download"
            echo
            echo "Every file is checked by the launcher's updater and the Linux installer before it's used. To check one yourself:"
            echo
            echo "- **Checksum:** compare with \`SHA256SUMS\` (\`Get-FileHash launcher.exe\` in PowerShell, \`sha256sum\` on Linux)."
            echo "- **Signature:** \`SHA256SUMS.sig\` is the release key's signature of \`SHA256SUMS\`; the launcher and installer check it."
            echo "- **Build provenance:** \`gh attestation verify <file> --repo ${{ github.repository }}\` shows it was built by this repository's release workflow, from tag \`v$VERSION\`."
            echo
            echo "### VirusTotal"
            echo
            if [ -s vt.md ]; then
              cat vt.md
              echo
              echo "Scanned when this release was built; the links show the current results."
            else
              echo "| File | Report |"
              echo "|---|---|"
              for f in launcher.exe uplay_r1_loader.dll dedicated_server.exe launcher-linux-x86_64 dedicated_server-linux-x86_64 coordinator-linux-x86_64; do
                sha="$(sha256sum "dist/$f" | cut -d' ' -f1)"
                echo "| \`$f\` | [VirusTotal](https://www.virustotal.com/gui/file/$sha) |"
              done
            fi
            echo
            echo "Some antivirus programs flag new, unsigned game tools by their behaviour (a launcher that installs a DLL into a game). If yours does, see [Antivirus warnings](https://github.com/${{ github.repository }}#antivirus-warnings)."
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # A draft: scripts/sign-release.sh signs SHA256SUMS with the offline
          # release key and publishes it. Launchers ignore unsigned releases.
          # The generated changelog follows the verification notes.
          flags=(--draft --generate-notes --notes-file notes.md --title "v$VERSION")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "${flags[@]}" dist/*

  docker:
    name: Server image
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/5th-echelon-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.prerelease == 'false' && format('{0}:latest', steps.name.outputs.image) || '' }}
