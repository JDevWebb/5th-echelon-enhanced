# The launcher in Tauri 2 (0.5.0): the Field ops screens as a web page in a native window, Rust
# behind it. Its own workspace for now, so the main workspace's tests and CI don't need
# WebKitGTK; it uses the workspace's crates by path. On Linux the egui launcher stays the program
# started, and opens this one when WebKitGTK 4.1 is there and it isn't gamescope (docs: plan L).
[package]
name = "launcher-tauri"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
identity = { path = "../../identity" }
hooks-config = { path = "../../hooks/hooks-config" }
server_api = { path = "../../api", package = "api" }
moderation = { path = "../../moderation" }
dedicated_server_config = { path = "../../dedicated_server/config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
rand = "0.8"
toml = "0.8"
setup = { path = "../../setup" }
# The egui launcher's library: the setup, the flows and the settings, without egui.
launcher = { path = "../../launcher", default-features = false }

[features]
# The client DLL built in (build.sh tauri sets HOOKS_DLL to dist/uplay_r1_loader.dll), as the
# egui launcher carries it: the setup installs it.
embed-dll = ["launcher/embed-dll"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
