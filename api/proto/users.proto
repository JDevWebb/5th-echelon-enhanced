syntax = "proto3";

package users;

service Users {
  rpc Login(LoginRequest) returns (LoginResponse);
  //  rpc Me(MeRequest) returns (MeResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Signs in with the identity key an account is linked to, instead of its password: for a
  // new PC, or an account whose password is lost. Optionally sets a new password.
  rpc KeyLogin(KeyLoginRequest) returns (LoginResponse);
}

service UsersAdmin {
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  // rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message ListRequest {
  // string query = 1;
  // int32 limit = 2;
  // int32 offset = 3;
}

message ListResponse {
  repeated User users = 1;
  int32 total = 2;
}

message GetRequest { string id = 1; }

message GetResponse { User user = 1; }

// message UpdateRequest {
//   string id = 1;
//   string username = 2;
// }

// message UpdateResponse {
//   string error = 1;
//   User user = 2;
// }

message DeleteRequest { string id = 1; }

message DeleteResponse {}

message User {
  string id = 1;
  string username = 2;
  repeated string ips = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string error = 1;
  string token = 2;
  User user = 3;
  // Lets the game register with the server's NAT helper under this account's name
  // (nat_proto's Ticket); empty when the helper is off.
  bytes nat_ticket = 4;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  // Ignored: the server sets the account id, so no one can take another's.
  string ubi_id = 3;
  // The player's identity, to link the new account to at once. On servers sharing friends,
  // it also reserves the name across them (a name another identity holds is refused).
  string global_id = 4;
  int64 time = 5;
  // Link signature (see friends.LinkIdentityRequest) for this server and username.
  string signature = 6;
}

message KeyLoginRequest {
  string username = 1;
  // The identity's public key (base32), as linked to the account.
  string global_id = 2;
  // Unix seconds the launcher signed at; must be within 5 minutes and newer than the last.
  int64 time = 3;
  // Signature (base32) of "5th-echelon/login/v1\n<server id>\n<username>\n<time>".
  string signature = 4;
  // Replaces the account's password when set.
  string new_password = 5;
}

message RegisterResponse {
  string error = 1;
  User user = 2;
}
