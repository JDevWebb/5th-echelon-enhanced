syntax = "proto3";

package users;

service Users {
  rpc Login(LoginRequest) returns (LoginResponse);
  //  rpc Me(MeRequest) returns (MeResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Signs in with the identity key an account is linked to, instead of its password: for a
  // new PC, or an account whose password is lost. Optionally sets a new password.
  rpc KeyLogin(KeyLoginRequest) returns (LoginResponse);
  // Whether a name is free for a new account here (and across the servers sharing friends),
  // without making anything: the launcher checks names as they're typed. Rate limited per
  // address, as sign-ins are.
  rpc NameAvailable(NameRequest) returns (NameAvailableResponse);
}

service UsersAdmin {
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  // rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message ListRequest {
  // string query = 1;
  // int32 limit = 2;
  // int32 offset = 3;
}

message ListResponse {
  repeated User users = 1;
  int32 total = 2;
}

message GetRequest { string id = 1; }

message GetResponse { User user = 1; }

// message UpdateRequest {
//   string id = 1;
//   string username = 2;
// }

// message UpdateResponse {
//   string error = 1;
//   User user = 2;
// }

message DeleteRequest { string id = 1; }

message DeleteResponse {}

message User {
  string id = 1;
  string username = 2;
  repeated string ips = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // The client signing in and its release ("launcher/0.3.156", "game/0.3.156"). Servers
  // refuse clients older than they allow, and ones that leave it empty.
  string client = 3;
  // The SHA-256 (hex) of the client's own file: the launcher's executable, or the game
  // add-on's DLL. Servers tell the project's signed releases from other builds by it.
  // Empty from clients before 0.4.5.
  string build = 4;
  // This PC's hardware ids, hashed (the hwid crate; 0.5.0 on): servers keep them in memory
  // only and pass them to the coordinator, which keys them again and refuses a PC that two of
  // them tie to a banned player's (F10).
  repeated HardwareId hardware = 5;
  // The PC is a virtual machine: its maker as its firmware names it ("VMware"), else empty.
  string vm = 6;
  // The game's session key (Ed25519 public key, 32 bytes, made for each run; 0.5.0 on): the
  // NAT ticket and relay pass in the answer name it, and the game signs its NAT probes with
  // it, so a copied ticket is no use without the key (nat_proto's SessionKey). Empty from
  // older clients and the launcher.
  bytes nat_key = 7;
  // The game's renderer, as its executable shows it: "dx9" or "dx11" (0.5.0 on). Servers pass
  // it on with the game's sign-in, for the Sessions page's count of each. Empty from the
  // launcher and older clients.
  string graphics = 8;
  // The game's own files that change play (both executables, its DLLs, the script and data
  // packages), as the add-on hashed them (0.5.0 on, report only): servers pass them on with
  // the game's sign-in, and the Sessions page shows a player whose files differ from
  // everyone else's. Empty from the launcher, older clients, and a game still hashing.
  repeated GameFile files = 9;
  // The names of other files next to the game's that can change it (loose .ini overrides,
  // other DLLs and packages): names only.
  repeated string other_files = 10;
  // The launcher's round trip to each of the network's relays at the game's start (0.5.0 on):
  // the matchmaking server estimates how far apart two players are from the relays they both
  // reached, nearer the truth than their places. Empty from the launcher and a game started
  // without it.
  repeated RelayPing relay_pings = 11;
  // The game's NAT traversal is off (Nat = "Off": LAN or VPN play): it never registers with
  // the NAT helper, so it isn't waited on, nor warned that it can't reach the relay. False
  // from the launcher and older clients.
  bool nat_off = 12;
}

// A round trip to one relay: its id, as the matchmaking server lists it, and milliseconds.
message RelayPing {
  string relay = 1;
  uint32 ms = 2;
}

// One of the game's files: its path under the game's SYSTEM folder ("Blacklist_game.exe",
// "UMDs/lobby.umd"), its size and its SHA-256 (64 hex characters).
message GameFile {
  string name = 1;
  uint64 size = 2;
  string sha256 = 3;
}

// One hardware id: its kind ("machine-guid", "smbios-uuid", "board-serial", "disk-serial",
// "linux-machine-id") and its hash (64 hex characters).
message HardwareId {
  string kind = 1;
  string hash = 2;
}

message LoginResponse {
  string error = 1;
  string token = 2;
  User user = 3;
  // Lets the game register with the server's NAT helper under this account's name
  // (nat_proto's Ticket); empty when the helper is off.
  bytes nat_ticket = 4;
  // On a network's matchmaking server: a pass its relays elsewhere take for this account's
  // name (4 bytes of day, 64 of Ed25519 signature; nat_proto's TicketPresent), for a ticket
  // of their own. Empty elsewhere.
  bytes relay_pass = 5;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  // Ignored: the server sets the account id, so no one can take another's.
  string ubi_id = 3;
  // The player's identity, to link the new account to at once. On servers sharing friends,
  // it also reserves the name across them (a name another identity holds is refused).
  string global_id = 4;
  int64 time = 5;
  // Link signature (see friends.LinkIdentityRequest) for this server and username.
  string signature = 6;
  // The host the player reached this server by, as signed.
  string host = 7;
  // The client signing in and its release ("launcher/0.3.156", "game/0.3.156"). Servers
  // refuse clients older than they allow, and ones that leave it empty.
  string client = 8;
  // As LoginRequest's.
  string build = 9;
}

message KeyLoginRequest {
  // Empty: the account here linked to this identity, whatever its name (NOT_FOUND when there's
  // none); the signature then names an empty username.
  string username = 1;
  // The identity's public key (base32), as linked to the account.
  string global_id = 2;
  // Unix seconds the launcher signed at; must be within 5 minutes and newer than the last.
  int64 time = 3;
  // Signature (base32) of identity::login_message(host, username, time, new_password).
  string signature = 4;
  // Replaces the account's password when set.
  string new_password = 5;
  // The host the player reached this server by, as signed.
  string host = 6;
  // The client signing in and its release ("launcher/0.3.156", "game/0.3.156"). Servers
  // refuse clients older than they allow, and ones that leave it empty.
  string client = 7;
  // As LoginRequest's.
  string build = 8;
  repeated HardwareId hardware = 9;
  string vm = 10;
}

message RegisterResponse {
  string error = 1;
  User user = 2;
}

message NameRequest { string name = 1; }

message NameAvailableResponse {
  enum Answer {
    UNKNOWN = 0;
    // Nobody has it here, nor across the servers sharing friends.
    FREE = 1;
    // An account here, or another player across the servers sharing friends, has it.
    TAKEN = 2;
    // It can't be a name: its length, its characters, or a reserved name.
    NOT_ALLOWED = 3;
  }
  Answer answer = 1;
  // Why, for TAKEN and NOT_ALLOWED, as a player reads it.
  string reason = 2;
}
