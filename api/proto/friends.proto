syntax = "proto3";

package friends;

service Friends {
    rpc List (ListRequest) returns (ListResponse);
    rpc Invite (InviteRequest) returns (InviteResponse);
    // Publishes the game session the caller is currently in, so that it shows up in the
    // friend lists of everybody else. The game announces its session through
    // UPLAY_USER_SetGameSession and expects to find a friend's session in the friend list -
    // without this, an accepted invitation has no destination and the game gives up with
    // "Failed to find party session for invite."
    rpc SetSession (SetSessionRequest) returns (SetSessionResponse);

    // The caller's friends, friend requests both ways and blocks, for the overlay.
    rpc Relationships (RelationshipsRequest) returns (RelationshipsResponse);
    // Players by part of their name, or who's online for an empty query.
    rpc Search (SearchRequest) returns (SearchResponse);
    // Asks a player to be friends (accepts, if they had asked the caller).
    rpc Request (TargetRequest) returns (ChangeResponse);
    rpc Accept (TargetRequest) returns (ChangeResponse);
    // Declines a request to the caller, or withdraws the caller's own.
    rpc Decline (TargetRequest) returns (ChangeResponse);
    rpc Remove (TargetRequest) returns (ChangeResponse);
    rpc Block (TargetRequest) returns (ChangeResponse);
    rpc Unblock (TargetRequest) returns (ChangeResponse);
    // Links the caller's account to their identity across servers: a public key, proved
    // with a signature (see docs/friends.md). Friends then follow them to other servers
    // that share a coordinator.
    rpc LinkIdentity (LinkIdentityRequest) returns (LinkIdentityResponse);
    // Unlinks the caller's account from their identity: friends stop following them here,
    // and the identity can no longer sign in to it.
    rpc UnlinkIdentity (UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
    // Gives the caller's account a new name. The account id stays, so friends and invites
    // carry on. A linked account signs the new name, which is reserved across servers
    // sharing friends.
    rpc Rename (RenameRequest) returns (RenameResponse);
}

// Whether a name is known to be its player's.
enum NameStatus {
    // Not linked to an identity: the name is only this server's.
    UNLINKED = 0;
    // Linked, on a server that doesn't share friends: the identity is known, the name only here.
    LINKED = 1;
    // Linked, and the name is the player's on every server sharing friends.
    RESERVED = 2;
    // Linked, but another player holds this name on the servers sharing friends.
    CONFLICT = 3;
}

message RenameRequest {
    string new_name = 1;
    // For a linked account: the link signature for the new name.
    int64 time = 2;
    string signature = 3;
    string host = 4;
}

message RenameResponse {
    string username = 1;
}

// How a player stands to the caller.
enum Relation {
    NONE = 0;
    FRIEND = 1;
    REQUEST_SENT = 2;
    REQUEST_RECEIVED = 3;
    BLOCKED = 4;
}

// What an online player is doing, when the server knows.
message Activity {
    // "svm" or "coop".
    string mode = 1;
    // "match" or "lobby".
    string room = 2;
    repeated string with = 3;
    uint32 map = 4;
}

message Player {
    // The account id (as in Friend.id); what the other calls take.
    string id = 1;
    string username = 2;
    bool is_online = 3;
    Relation relation = 4;
    Activity activity = 5;
    // Short form of the player's identity (e.g. "K7QF-2M9D"); empty when not linked.
    string identity = 6;
    NameStatus name = 7;
}

message RelationshipsRequest {}

message RelationshipsResponse {
    repeated Player friends = 1;
    repeated Player requests_received = 2;
    repeated Player requests_sent = 3;
    repeated Player blocked = 4;
    // "everyone": every player is on the game's friend list; "mutual": only friends.
    string mode = 5;
    // The caller's own name: CONFLICT means they should rename.
    NameStatus my_name = 6;
    string my_identity = 7;
    // Friends playing on another server sharing friends (see FriendElsewhere).
    repeated FriendElsewhere elsewhere = 8;
}

// A friend online on another server of the group: to play together, one of you joins the
// other's server.
message FriendElsewhere {
    // Their name on that server.
    string username = 1;
    // That server's name and region, as its directory entry shows them.
    string server = 2;
    string region = 3;
    // What to connect to.
    string host = 4;
}

message SearchRequest {
    string query = 1;
}

message SearchResponse {
    repeated Player players = 1;
}

// A player, by account id or else by name.
message TargetRequest {
    string id = 1;
    string username = 2;
}

message ChangeResponse {
    // How the player stands to the caller now.
    Relation relation = 1;
}

message LinkIdentityRequest {
    // The identity's public key (Ed25519, base32).
    string global_id = 1;
    // Unix seconds the launcher signed at.
    int64 time = 2;
    // Signature (base32) of identity::link_message(host, username, time).
    string signature = 3;
    // The host the player reached this server by, as signed (never what the server says
    // about itself: that's what stops a server replaying signatures made for it).
    string host = 4;
}

message LinkIdentityResponse {}

message UnlinkIdentityRequest {}

message UnlinkIdentityResponse {}

message Friend {
    string id = 1;
    string username = 2;
    bool is_online = 3;
    // Game session this player currently advertises; 0 means "not in a session".
    uint32 session_id = 4;
    // Session is private, i.e. it can only be entered through an invitation.
    bool invite_only = 5;
    // Opaque session payload the game handed to UPLAY_USER_SetGameSession (496 bytes).
    // The session id alone gets an invitation past the lookup, but the game then opens a
    // session of its own instead of joining - it needs this block to actually enter one.
    bytes session_data = 6;
    // Principal id of this player, as Quazal uses it. On the working matchmaking path the
    // guest finds the host through SearchSessionsWithParticipants, which takes participant
    // ids - so without the pid the game has nothing to search with.
    uint32 pid = 7;
}

message SetSessionRequest {
    // 0 clears the advertisement (the game does that through UPLAY_USER_ClearGameSession).
    uint32 session_id = 1;
    bool invite_only = 2;
    // The raw session payload, passed through unchanged.
    bytes session_data = 3;
}

message SetSessionResponse {
}

message ListRequest {
    // string filter = 1;
}

message ListResponse {
    repeated Friend friends = 1;
}

message InviteRequest {
    string id = 1;
}

message InviteResponse {

}