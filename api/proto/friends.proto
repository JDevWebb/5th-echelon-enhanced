syntax = "proto3";

package friends;

service Friends {
    rpc List (ListRequest) returns (ListResponse);
    rpc Invite (InviteRequest) returns (InviteResponse);
    // Asks to join a friend's game without an invitation: queues an invitation from the friend
    // to the caller, delivered as a join the caller asked for (InviteEvent.requested), so the
    // caller's running game joins the party the friend is in - their own, or one they're a
    // member of (then the invitation counts as the friend's, like a member's invitation: it
    // holds while the party's host has the friend as a friend), or the public match they're
    // in. Only a friend (or anyone, in "everyone" mode); a party its host made invite-only and
    // a private match, theirs or not, need a real invitation, and a match that has started
    // can't be joined. Servers that offer it list "join-now" in /api/info's features.
    rpc JoinNow (JoinNowRequest) returns (JoinNowResponse);
    // Joins a public match picked from the lobby browser (its room id, from /api/playing), as
    // JoinNow does: the caller's running game joins it on its next event poll. NOT_FOUND when
    // it's gone, private, or its host blocked the caller (nobody learns they were blocked);
    // NOT_FRIENDS when the caller blocked its host; STARTED when it's under way. Servers that
    // offer it list "choose-match" in /api/info's features.
    rpc JoinRoom (JoinRoomRequest) returns (JoinNowResponse);
    // Puts the caller in line for a public match that can't take them yet (under way, or
    // full), or keeps their place (the launcher asks again every few seconds while it waits; a
    // place not asked for in 30 s goes), or takes them out (on = false). When it can take
    // players, the first in line, as many as it has free seats, may join it (JoinRoom); anyone
    // else's JoinRoom is QUEUED and quick-match searches leave it out until they're in. One
    // queue at a time; eight at most. Servers that offer it list "match-queue" in /api/info's
    // features.
    rpc QueueRoom (QueueRoomRequest) returns (QueueRoomResponse);
    // The caller's quick match searches find nothing until they host a match (five minutes at
    // most), so their game starts a brand-new public match rather than join an open one.
    rpc NewMatch (NewMatchRequest) returns (NewMatchResponse);
    // The public matches on this server in full, for the launcher's Matches tab: who's in each
    // (host, parties, friends, teams), its state and settings, and how far each player is from
    // the caller. Signed-in players only; a match with someone the caller blocked, or who
    // blocked them, is left out (counted); private matches only counted. Servers that offer it
    // list "lobbies" in /api/info's features.
    rpc Lobbies (LobbiesRequest) returns (LobbiesResponse);
    // Publishes the game session the caller is currently in, so that it shows up in the
    // friend lists of everybody else. The game announces its session through
    // UPLAY_USER_SetGameSession and expects to find a friend's session in the friend list -
    // without this, an accepted invitation has no destination and the game gives up with
    // "Failed to find party session for invite."
    rpc SetSession (SetSessionRequest) returns (SetSessionResponse);

    // The caller's friends, friend requests both ways and blocks, for the overlay.
    rpc Relationships (RelationshipsRequest) returns (RelationshipsResponse);
    // Players by part of their name, or who's online for an empty query.
    rpc Search (SearchRequest) returns (SearchResponse);
    // Asks a player to be friends (accepts, if they had asked the caller).
    rpc Request (TargetRequest) returns (ChangeResponse);
    rpc Accept (TargetRequest) returns (ChangeResponse);
    // Declines a request to the caller, or withdraws the caller's own.
    rpc Decline (TargetRequest) returns (ChangeResponse);
    rpc Remove (TargetRequest) returns (ChangeResponse);
    rpc Block (TargetRequest) returns (ChangeResponse);
    rpc Unblock (TargetRequest) returns (ChangeResponse);
    // Links the caller's account to their identity across servers: a public key, proved
    // with a signature (see docs/friends.md). Friends then follow them to other servers
    // that share a coordinator.
    rpc LinkIdentity (LinkIdentityRequest) returns (LinkIdentityResponse);
    // Unlinks the caller's account from their identity: friends stop following them here,
    // and the identity can no longer sign in to it.
    rpc UnlinkIdentity (UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
    // Gives the caller's account a new name. The account id stays, so friends and invites
    // carry on. A linked account signs the new name, which is reserved across servers
    // sharing friends.
    rpc Rename (RenameRequest) returns (RenameResponse);
}

// Whether a name is known to be its player's.
enum NameStatus {
    // Not linked to an identity: the name is only this server's.
    UNLINKED = 0;
    // Linked, on a server that doesn't share friends: the identity is known, the name only here.
    LINKED = 1;
    // Linked, and the name is the player's on every server sharing friends.
    RESERVED = 2;
    // Linked, but another player holds this name on the servers sharing friends.
    CONFLICT = 3;
    // The network's admins found the name breaks its rules: the player should choose another.
    // Only ever the caller's own (my_name); others see their usual status.
    NOT_ALLOWED = 4;
}

message RenameRequest {
    string new_name = 1;
    // For a linked account: the link signature for the new name.
    int64 time = 2;
    string signature = 3;
    string host = 4;
}

message RenameResponse {
    string username = 1;
}

// How a player stands to the caller.
enum Relation {
    NONE = 0;
    FRIEND = 1;
    REQUEST_SENT = 2;
    REQUEST_RECEIVED = 3;
    BLOCKED = 4;
}

// What an online player is doing, when the server knows.
message Activity {
    // "svm" or "coop".
    string mode = 1;
    // "match" or "lobby".
    string room = 2;
    repeated string with = 3;
    // The map (session attribute 101); 0 when the room didn't say.
    uint32 map = 4;
    // The game mode (attribute 102, the game's EGameMode: 8 is SvM Classic); 0 when the room
    // didn't say (0 is single player, never a room).
    uint32 game_mode = 5;
    // A friend can join them there without an invitation (JoinNow): the room is an open party
    // (not invite-only), with the player as its host or a member, or a public match. Not an
    // invite-only party or a private match, which need a real invitation, nor a match that has
    // started.
    bool joinable = 6;
}

message Player {
    // The account id (as in Friend.id); what the other calls take.
    string id = 1;
    string username = 2;
    bool is_online = 3;
    Relation relation = 4;
    Activity activity = 5;
    // Short form of the player's identity (e.g. "K7QF-2M9D"); empty when not linked.
    string identity = 6;
    NameStatus name = 7;
}

message RelationshipsRequest {}

message RelationshipsResponse {
    repeated Player friends = 1;
    repeated Player requests_received = 2;
    repeated Player requests_sent = 3;
    repeated Player blocked = 4;
    // "everyone": every player is on the game's friend list; "mutual": only friends.
    string mode = 5;
    // The caller's own name: CONFLICT means they should rename.
    NameStatus my_name = 6;
    string my_identity = 7;
    // Friends playing on another server sharing friends (see FriendElsewhere).
    repeated FriendElsewhere elsewhere = 8;
}

// A friend online on another server of the group: to play together, one of you joins the
// other's server.
message FriendElsewhere {
    // Their name on that server.
    string username = 1;
    // That server's name and region, as its directory entry shows them.
    string server = 2;
    string region = 3;
    // What to connect to.
    string host = 4;
}

message SearchRequest {
    string query = 1;
}

message SearchResponse {
    repeated Player players = 1;
}

// A player, by account id, else by identity (their account here, as chat names players: a
// name alone may be another account's here), else by name.
message TargetRequest {
    string id = 1;
    string username = 2;
    string identity = 3;
}

message ChangeResponse {
    // How the player stands to the caller now.
    Relation relation = 1;
}

message LinkIdentityRequest {
    // The identity's public key (Ed25519, base32).
    string global_id = 1;
    // Unix seconds the launcher signed at.
    int64 time = 2;
    // Signature (base32) of identity::link_message(host, username, time).
    string signature = 3;
    // The host the player reached this server by, as signed (never what the server says
    // about itself: that's what stops a server replaying signatures made for it).
    string host = 4;
}

message LinkIdentityResponse {}

message UnlinkIdentityRequest {}

message UnlinkIdentityResponse {}

message Friend {
    string id = 1;
    string username = 2;
    bool is_online = 3;
    // Game session this player currently advertises; 0 means "not in a session".
    uint32 session_id = 4;
    // Session is private, i.e. it can only be entered through an invitation.
    bool invite_only = 5;
    // Opaque session payload the game handed to UPLAY_USER_SetGameSession (496 bytes).
    // The session id alone gets an invitation past the lookup, but the game then opens a
    // session of its own instead of joining - it needs this block to actually enter one.
    bytes session_data = 6;
    // Principal id of this player, as Quazal uses it. On the working matchmaking path the
    // guest finds the host through SearchSessionsWithParticipants, which takes participant
    // ids - so without the pid the game has nothing to search with.
    uint32 pid = 7;
    // That session is a private match (an invite-only room of kind 0), not an invite-only
    // party: a party's leader invited into it keeps its party (the host-migration beta).
    bool private_match = 8;
}

message SetSessionRequest {
    // 0 clears the advertisement (the game does that through UPLAY_USER_ClearGameSession).
    uint32 session_id = 1;
    bool invite_only = 2;
    // The raw session payload, passed through unchanged.
    bytes session_data = 3;
}

message SetSessionResponse {
}

message ListRequest {
    // string filter = 1;
}

message ListResponse {
    repeated Friend friends = 1;
}

message InviteRequest {
    string id = 1;
}

message InviteResponse {

}

message JoinNowRequest {
    // The friend to join (their account id).
    string id = 1;
}

message JoinRoomRequest {
    // The room (session id) to join.
    uint32 room = 1;
}

message QueueRoomRequest {
    uint32 room = 1;
    // False leaves the queue.
    bool on = 2;
}

message QueueRoomResponse {
    enum Status {
        // In line (or left it, for on = false).
        OK = 0;
        // Gone, private, or not one the caller may join (JoinRoom's NOT_FOUND).
        NOT_FOUND = 1;
        // Eight are waiting already.
        FULL = 2;
    }
    Status status = 1;
    // The caller's place (1 = next; 0 when not in line) and how many wait.
    uint32 place = 2;
    uint32 waiting = 3;
    // A short line for the player when they couldn't take a place.
    string detail = 4;
}

message NewMatchRequest {
    // False takes the ask back: searches find matches again.
    bool on = 1;
}

message NewMatchResponse {
    // How long the ask holds unless the player hosts first, in seconds (0 when taken back).
    uint32 seconds = 1;
}

message JoinNowResponse {
    enum Status {
        // The join was queued; the caller's running game joins on its next event poll.
        OK = 0;
        // No such player.
        NOT_FOUND = 1;
        // Not a friend (on a server that only lets friends join each other), or someone the
        // caller blocked (or the host of their game).
        NOT_FRIENDS = 2;
        // The friend isn't in a game right now. Also the answer when they, or their game's
        // host, blocked the caller: nobody learns they were blocked.
        OFFLINE = 3;
        // The friend is in a private match (hosting it or not), or a party its host made
        // invite-only: it needs a real invitation.
        PRIVATE = 4;
        // The friend is a member of someone else's party but can't bring anyone in (as with a
        // member's invitation): its host doesn't have them as a friend, or they're only a
        // guest there.
        NOT_FRIENDS_WITH_HOST = 5;
        // The friend's match has started: its host's game turns joiners away until it's over.
        STARTED = 6;
        // Players are waiting for the match's free seats (QueueRoom): the caller joins its
        // queue rather than go before them.
        QUEUED = 7;
    }
    Status status = 1;
    // A short line for the player when the join can't go ahead.
    string detail = 2;
    // JoinRoom's OK: the account id of the match's host, whose invitation the game is to take
    // as the requested join (the launcher's join request names it).
    string host_id = 3;
}
message LobbiesRequest {}

message LobbiesResponse {
    // Public matches, the caller's friends' first, then the busiest.
    repeated Lobby lobbies = 1;
    // Left out, counted: matches with someone the caller blocked (a match with someone who blocked
    // the caller is left out uncounted); private matches and their players; players in parties
    // and in no match.
    uint32 hidden_blocked = 2;
    uint32 private_matches = 3;
    uint32 private_players = 4;
    uint32 party_players = 5;
    // Everyone signed in to this server's game service now, in a match or not.
    uint32 online = 6;
}

message Lobby {
    // Its room (session id), to join it by (JoinRoom).
    uint32 room = 1;
    // "svm" or "coop", the game mode (attribute 102, 0 when not said) and the map (101).
    string kind = 2;
    uint32 game_mode = 3;
    uint32 map = 4;
    // Its seats (public and private; 0 when not said) and the players its mode is made for.
    uint32 seats = 5;
    uint32 mode_size = 6;
    // How long it has been open, in seconds.
    uint32 open_secs = 7;
    // Its host's game's word for its state ("RoundState_Started", "CoopMissionState_InGame";
    // empty from a host before 0.5.0 or before its first round), whether it's under way (joiners
    // turned away), for how long (seconds), and how many rounds have started.
    string state = 8;
    bool under_way = 9;
    uint32 under_way_secs = 10;
    uint32 round = 11;
    // The round's settings as the host's game has them (F4), by the script property's name.
    map<string, float> settings = 12;
    // The caller's estimated round trip to its host, in ms, in 25 ms steps (0: unknown).
    uint32 ping_ms = 13;
    repeated LobbyPlayer players = 14;
    // How many wait to join it (QueueRoom), and the caller's place among them (1 = next; 0 when
    // not waiting).
    uint32 waiting = 15;
    uint32 queue_place = 16;
}

message LobbyPlayer {
    string name = 1;
    bool host = 2;
    // Players who came as a party share a number (0: on their own).
    uint32 party = 3;
    // The caller's friend.
    bool friend = 4;
    // "spy" or "merc" in Spies vs Mercs, as the host's game says (empty when it doesn't).
    string team = 5;
    // The caller's estimated round trip to them, in ms, in 25 ms steps: only for the caller's
    // friends (0: unknown, or not a friend).
    uint32 ping_ms = 6;
}
