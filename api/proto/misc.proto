syntax = "proto3";

package misc;

import "users.proto";

service Misc {
    rpc Event(EventRequest) returns (EventResponse);
    rpc TestP2P(TestP2PRequest) returns (TestP2PResponse);
    // What the server saw of the player's last game session: whether to ask them how it went.
    rpc SessionSummary(SessionSummaryRequest) returns (SessionSummaryResponse);
    // The player's feedback, with their logs if they agreed: the server adds what it logged
    // about them and passes it on to the network's admins.
    rpc Report(ReportRequest) returns (ReportResponse);
    // The game's warnings, errors and network events as they happen (redacted on the
    // player's PC), for the server's admins: Settings › Feedback turns them off.
    rpc ClientLog(ClientLogRequest) returns (ClientLogResponse);
}

message ClientLogRequest {
    repeated ClientLogLine lines = 1;
    // Lines the game had to leave out since the last request (too many at once).
    uint32 dropped = 2;
    // The player's diagnostics agreement covers the game's whole log when something goes
    // wrong (launcher Settings › Feedback): the server may ask for it in its answer.
    bool full_logs = 3;
}
message ClientLogLine {
    // Unix milliseconds on the player's PC.
    int64 at = 1;
    // ERROR, WARN or INFO.
    string level = 2;
    // Where in the client it came from (e.g. hooks::hooks::nat).
    string target = 3;
    string message = 4;
}
message ClientLogResponse {
    // Lines the server kept; the rest went over its limit.
    uint32 kept = 1;
    // Something went wrong for this player (and they agreed): send the game's log from this
    // time on (Unix seconds) as a report with the triggers "auto" and "auto:<problem>".
    // 0: nothing wanted.
    int64 send_log_since = 2;
    // What went wrong: join_failed, nat_lost, relay_stopped, restarted.
    string send_log_problem = 3;
}

message EventRequest {}
message EventResponse {
    InviteEvent invite = 1;
    FriendEvent friend = 2;
    // Answers from the network's admins (the launcher's Support page) the player hasn't read:
    // the overlay says so. 0 from servers before 0.4.3, or off the community network.
    uint32 support_unread = 3;
}

message FriendEvent {
    enum Kind {
        // They asked the player to be friends.
        REQUEST = 0;
        // They accepted the player's request.
        ACCEPTED = 1;
    }
    Kind kind = 1;
    users.User from = 2;
}

message InviteEvent {
    int64 id = 1;
    users.User sender = 2;
    bool force_join = 3;
}

message TestP2PRequest {
    bytes challenge = 1;
}
message TestP2PResponse {
    bytes challenge = 2;
}
message SessionSummaryRequest {}
message SessionSummaryResponse {
    // The last play session (Unix seconds); 0 when there was none.
    int64 started = 1;
    int64 ended = 2;
    // Joins the player's game reported failing in it, and how many of those were refused as
    // a different version of the game.
    int32 failed_joins = 3;
    int32 version_mismatches = 4;
    // Whether the player's matches went through the server's relay.
    bool relayed = 5;
    // Matches they were in, in all.
    int32 matches = 6;
    // All of it, and more, as JSON (sent along with a report).
    string json = 7;
}

message ReportFile {
    // [A-Za-z0-9._-], at most 64 characters.
    string name = 1;
    // gzip.
    bytes gzip = 2;
    // Uncompressed.
    uint64 size = 3;
}

message ReportRequest {
    // "good", "bad" or "".
    string rating = 1;
    // Any of: join, lag, crash, connection, version, signin, other.
    repeated string problems = 2;
    string comment = 3;
    // Why the launcher asked: failed_join, relayed, panic, exit_code, signin_refused,
    // version_mismatch, disconnect, routine.
    repeated string triggers = 4;
    // launcher, client, build, os, language.
    map<string, string> client = 5;
    // Redacted on the player's PC. None when they didn't agree to send logs.
    repeated ReportFile files = 6;
}
message ReportResponse {
    string id = 1;
}
