[package]
name = "launcher"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[features]
embed-dll = ["brotli"]
# setup's test-community: a test network as the community network (the gamebox). Never released.
test-community = ["setup/test-community"]

[dependencies]
base64 = "0.22"
anyhow = { workspace = true }
bytes = "1"
brotli = { workspace = true, optional = true }
dedicated_server_config = { path = "../dedicated_server/config" }
goblin = { workspace = true, default-features = false, features = [
    "pe32",
    "pe64",
    "std",
] }
hooks-addresses = { path = "../hooks/hooks-addresses" }
hooks-config = { path = "../hooks/hooks-config" }
hwid = { path = "../hwid" }
http = "1"
http-body = "1"
nat_proto = { path = "../nat_proto" }
portmap = { path = "../portmap" }
prost = { workspace = true }
quazal = { path = "../quazal" }
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sc_bl_protocols = { path = "../dedicated_server/sc_bl_protocols" }
serde = { workspace = true }
serde_json = { workspace = true }
server_api = { path = "../api", package = "api" }
setup = { path = "../setup" }
identity = { path = "../identity" }
moderation = { path = "../moderation" }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "macros"] }
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
toml = { workspace = true }
tower-service = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.54.0" # hudhook
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Security",
]

[dev-dependencies]
http-body-util = "0.1"

[build-dependencies]
brotli = { workspace = true }
jzon = { workspace = true }
goblin = { workspace = true, default-features = false, features = [
    "pe32",
    "pe64",
    "std",
] }

