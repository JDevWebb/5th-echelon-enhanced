[package]
name = "launcher"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
embed-dll = ["brotli"]
GetAdapterInfos = []

[dependencies]
anyhow = { workspace = true }
brotli = { workspace = true, optional = true }
dedicated_server_config = { path = "../dedicated_server/config" }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
goblin = { workspace = true, default-features = false, features = [
    "pe32",
    "pe64",
    "std",
] }
hooks-addresses = { path = "../hooks/hooks-addresses" }
hooks-config = { path = "../hooks/hooks-config" }
nat_proto = { path = "../nat_proto" }
portmap = { path = "../portmap" }
quazal = { path = "../quazal" }
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sc_bl_protocols = { path = "../dedicated_server/sc_bl_protocols" }
serde = { workspace = true }
serde_json = { workspace = true }
server_api = { path = "../api", package = "api" }
setup = { path = "../setup" }
identity = { path = "../identity" }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "macros"] }
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"

# Linux (and Steam Deck): X11 (XWayland on Wayland desktops), and the
# desktop's own file picker through its portal, so GTK isn't needed.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.54.0" # hudhook
features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Security",
]

[build-dependencies]
brotli = { workspace = true }
jzon = { workspace = true }
winres = { workspace = true }
image = { workspace = true, default-features = false, features = ["png"] }
goblin = { workspace = true, default-features = false, features = [
    "pe32",
    "pe64",
    "std",
] }

[package.metadata.winres]
# Tools that install or update the client find launchers by this product
# name; keep "5th Echelon Launcher" in it. FileDescription is set by build.rs from release.toml.
ProductName = "5th Echelon Launcher"
OriginalFilename = "launcher.exe"
InternalName = "launcher"
