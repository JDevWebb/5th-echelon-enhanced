# The launcher (from 0.5.0; docs/slint-plan.md): released as launcher.exe and
# launcher-linux-x86_64, one native window on Windows, Linux and the Steam Deck, with no web view
# to install. The design was the Tauri launcher's (removed with 0.5.0), with 5th Echelon
# Enhanced's own brand. The logic is the egui launcher's library (`launcher`, built without its
# interface). A workspace of its own: Slint's dependencies don't go into the main workspace's lock.
[package]
name = "launcher-slint"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[dependencies]
# Slint's royalty-free licence for desktop apps (credit in About): this project's code is MIT.
# winit for the window's own title bar (dragging, maximising); OpenGL (femtovg) with the software
# renderer as the fallback where there's no OpenGL 2 (a virtual machine without its driver).
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "unstable-winit-030"] }
launcher = { path = "../launcher", default-features = false }
setup = { path = "../setup" }
identity = { path = "../identity" }
hooks-config = { path = "../hooks/hooks-config" }
server_api = { path = "../api", package = "api" }
tracing = "0.1"
rand = "0.8"
moderation = { path = "../moderation" }
dedicated_server_config = { path = "../dedicated_server/config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
toml = "0.8"
# The screenshots (--shots, build.sh slint-shots) as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux: fontconfig opened when the launcher runs (every desktop and the Deck have it), not linked
# when it's built, so one file works on every distribution (and builds without its headers).
# The system's file picker: Windows' own, and on Linux the desktop's through its portal (no GTK).
[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }

[build-dependencies]
slint-build = "~1.18"
winres = "0.1.12"

[features]
# The client DLL built in (build.sh windows and linux set HOOKS_DLL to dist/uplay_r1_loader.dll), as the
# egui launcher carries it: the setup installs it.
embed-dll = ["launcher/embed-dll"]
# A test network as the community network (the gamebox against the rehearsal; FE_TEST_COMMUNITY
# when built). Never released.
test-community = ["launcher/test-community"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
