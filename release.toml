# The release name and number, in one place. Every build reads this
# (build/release.rs): the server reports it in /api/info, and the overlay,
# the launcher title and the version resources of launcher.exe and
# uplay_r1_loader.dll show it.
#
# major.minor.patch, moved on per release, not per change: between releases it
# names the next one, with a -dev suffix (0.4.1-dev until 0.4.1 is out). The
# suffix marks builds that aren't a signed release, and comes off when one is
# (scripts/release.sh, which then moves on to the next patch). 0.2.5 was
# upstream's last release; 5th Echelon Enhanced continued from 0.3.0, and 0.4.0 is its
# first public release.
name = "5th Echelon Enhanced"
version = "0.4.3"
