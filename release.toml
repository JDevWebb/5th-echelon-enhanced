# The release name and number, in one place. Every build reads this
# (build/release.rs): the server reports it in /api/info, and the overlay,
# the launcher title and the version resources of launcher.exe and
# uplay_r1_loader.dll show it.
#
# major.minor.patch: every change or patch bumps the patch number (0.3.148 was
# the estimate of the fork's changes so far: 119 commits since the import from
# the private fork, plus the 29 it carried). The -dev suffix marks builds that
# aren't a signed release; it comes off when one is. 0.2.5 was upstream's last
# release; this fork continues from 0.3.0.
name = "5th Echelon Enhanced"
version = "0.3.178-dev"
